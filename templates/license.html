<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate — Route Planner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1a1a2e;
        }
        .header {
            background: #1a73e8;
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header h1 { font-size: 20px; font-weight: 600; }

        .container { max-width: 480px; margin: 80px auto; padding: 0 16px; width: 100%; }

        .card {
            background: white;
            border-radius: 12px;
            padding: 36px 32px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            text-align: center;
        }

        .lock-icon { font-size: 40px; margin-bottom: 16px; }
        .card h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .card p { font-size: 14px; color: #666; margin-bottom: 28px; line-height: 1.5; }

        input[type="text"] {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
            color: #1a1a2e;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'SF Mono', 'Consolas', monospace;
            margin-bottom: 16px;
        }
        input[type="text"]:focus { border-color: #1a73e8; }
        input[type="text"]::placeholder { letter-spacing: 1px; color: #bbb; text-transform: none; font-family: inherit; }

        .btn-activate {
            width: 100%;
            background: #1a73e8;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-activate:hover { background: #1557b0; }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 10px 14px;
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 16px;
            display: {% if error %}block{% else %}none{% endif %};
        }

        .hint { font-size: 12px; color: #aaa; margin-top: 16px; }
        .hint a { color: #1a73e8; text-decoration: none; }
    </style>
</head>
<body>

<div class="header">
    <span>🗺</span>
    <h1>Route Planner</h1>
</div>

<div class="container">
    <div class="card">
        <div class="lock-icon">🔑</div>
        <h2>Activate Your Copy</h2>
        <p>Enter the licence key you received to get started.<br>
           It looks like <strong>ROUTE-XXXX-XXXX-XXXX</strong></p>

        <form method="POST">
            <div class="error-box" id="errorBox">{% if error %}{{ error }}{% endif %}</div>
            <input type="text" name="license_key" id="keyInput"
                   placeholder="ROUTE-XXXX-XXXX-XXXX"
                   value="{{ submitted_key or '' }}"
                   autocomplete="off" spellcheck="false"
                   autofocus>
            <button type="submit" class="btn-activate">Activate →</button>
        </form>

        <div class="hint">
            Need a key? Contact <a href="mailto:yee.ang01@gmail.com">yee.ang01@gmail.com</a>
        </div>
    </div>
</div>

<script>
/* Auto-format key as user types: insert dashes at positions 6, 11, 16 */
const inp = document.getElementById('keyInput');
inp.addEventListener('input', function() {
    let v = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v.startsWith('ROUTE')) v = v.slice(5);
    let parts = [];
    if (v.length > 0) parts.push(v.slice(0, 4));
    if (v.length > 4) parts.push(v.slice(4, 8));
    if (v.length > 8) parts.push(v.slice(8, 12));
    this.value = parts.length ? 'ROUTE-' + parts.join('-') : '';
});
</script>
</body>
</html>
