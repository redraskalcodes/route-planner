name: Build Route Planner

on:
  workflow_dispatch:   # run manually from GitHub with one click

jobs:

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Inject credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Build Mac app
        run: pyinstaller route_planner.spec

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "build123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build123" build.keychain
          security list-keychains -d user -s build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "build123" build.keychain

      - name: Sign app
        run: |
          codesign --deep --force --verify --verbose \
            --sign "Developer ID Application: Yee Ling Ang (T7P783UZ9J)" \
            --options runtime \
            "dist/Route Planner.app"

      - name: Notarize app
        env:
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cd dist
          zip -r "Route Planner Mac.zip" "Route Planner.app"
          xcrun notarytool submit "Route Planner Mac.zip" \
            --apple-id "wineponzwannabe@gmail.com" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "T7P783UZ9J" \
            --wait
          xcrun stapler staple "Route Planner.app"
          rm "Route Planner Mac.zip"
          zip -r "Route Planner Mac.zip" "Route Planner.app"

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: Route-Planner-Mac
          path: dist/Route Planner Mac.zip
          retention-days: 30


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Inject credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
        shell: bash

      - name: Build Windows exe
        run: pyinstaller route_planner.spec

      - name: Zip exe folder
        run: |
          Compress-Archive -Path "dist\Route Planner" -DestinationPath "dist\Route Planner Windows.zip"
        shell: powershell

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Route-Planner-Windows
          path: dist\Route Planner Windows.zip
          retention-days: 30
