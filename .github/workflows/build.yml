name: Build Route Planner

on:
  workflow_dispatch:   # run manually from GitHub with one click

jobs:

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Inject credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Build Mac app
        run: pyinstaller route_planner.spec

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "build123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build123" build.keychain
          security list-keychains -d user -s build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "build123" build.keychain

      - name: Inspect app bundle structure
        run: |
          APP="dist/Route Planner.app"
          echo "=== Python binary locations and hardlink counts ==="
          find "$APP" -name "Python" -not -name "*.py" | while read f; do
            echo "---"
            ls -li "$f"
            file "$f"
          done
          echo "=== MacOS executables ==="
          ls -li "$APP/Contents/MacOS/"
          echo "=== Existing signatures on failing files ==="
          for f in \
            "$APP/Contents/MacOS/Route Planner" \
            "$APP/Contents/Resources/Python" \
            "$APP/Contents/Frameworks/Python"; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              codesign -dv "$f" 2>&1 || echo "(no signature)"
            fi
          done

      - name: Sign app
        run: |
          APP="dist/Route Planner.app"
          IDENTITY="Developer ID Application: Yee Ling Ang (T7P783UZ9J)"

          # Entitlements needed for embedded Python with hardened runtime
          cat > /tmp/entitlements.plist << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          ENTEOF

          # Break hardlinks: any file with link count >1 shares an inode with another file.
          # Signing one would affect all — break them into separate copies first.
          echo "=== Breaking hardlinks ==="
          find "$APP" -type f -links +1 | while read f; do
            echo "Breaking hardlink: $f (nlink=$(stat -f '%l' "$f"))"
            cp "$f" "${f}.__hl_tmp__"
            mv "${f}.__hl_tmp__" "$f"
          done

          # Step 1: Sign all Mach-O binaries NOT inside .framework directories
          echo "=== Signing individual Mach-O binaries ==="
          find "$APP" -type f | grep -v "\.framework/" | while read f; do
            if file "$f" | grep -qE "Mach-O"; then
              echo "Signing: $f"
              codesign --force --sign "$IDENTITY" \
                --options runtime \
                --timestamp \
                --entitlements /tmp/entitlements.plist \
                "$f"
            fi
          done

          # Step 2: Sign Python.framework versioned bundles explicitly, then the top-level frameworks
          echo "=== Signing frameworks (deepest first) ==="
          find "$APP" -name "*.framework" -type d | sort -r | while read fw; do
            echo "Signing framework: $fw"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --timestamp \
              --entitlements /tmp/entitlements.plist \
              "$fw"
          done

          # Step 3: Sign the main app bundle last
          echo "=== Signing app bundle ==="
          codesign --force --verify --verbose \
            --sign "$IDENTITY" \
            --options runtime \
            --timestamp \
            --entitlements /tmp/entitlements.plist \
            "$APP"

      - name: Notarize app
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > /tmp/AuthKey.p8
          cd dist
          zip -r "Route Planner Mac.zip" "Route Planner.app"
          SUBMIT_OUTPUT=$(xcrun notarytool submit "Route Planner Mac.zip" \
            --key /tmp/AuthKey.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER }}" \
            --wait --output-format json)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          STATUS=$(echo "$SUBMIT_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed with status: $STATUS — fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --key /tmp/AuthKey.p8 \
              --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
              --issuer "${{ secrets.APPLE_API_ISSUER }}"
            rm /tmp/AuthKey.p8
            exit 1
          fi
          xcrun stapler staple "Route Planner.app"
          rm "Route Planner Mac.zip"
          zip -r "Route Planner Mac.zip" "Route Planner.app"
          rm /tmp/AuthKey.p8

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: Route-Planner-Mac
          path: dist/Route Planner Mac.zip
          retention-days: 30


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Inject credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
        shell: bash

      - name: Build Windows exe
        run: pyinstaller route_planner.spec

      - name: Zip exe folder
        run: |
          Compress-Archive -Path "dist\Route Planner" -DestinationPath "dist\Route Planner Windows.zip"
        shell: powershell

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Route-Planner-Windows
          path: dist\Route Planner Windows.zip
          retention-days: 30
