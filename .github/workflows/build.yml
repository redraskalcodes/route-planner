name: Build Route Planner

on:
  workflow_dispatch:   # run manually from GitHub with one click

jobs:

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Inject credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Build Mac app
        run: pyinstaller route_planner.spec

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "build123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build123" build.keychain
          security list-keychains -d user -s build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "build123" build.keychain

      - name: Sign app
        run: |
          APP="dist/Route Planner.app"
          IDENTITY="Developer ID Application: Yee Ling Ang (T7P783UZ9J)"

          python3 -c "import plistlib; plist={'com.apple.security.cs.allow-jit':True,'com.apple.security.cs.allow-unsigned-executable-memory':True,'com.apple.security.cs.disable-library-validation':True}; open('/tmp/entitlements.plist','wb').write(plistlib.dumps(plist))"
          plutil -lint /tmp/entitlements.plist && echo "Entitlements plist OK"

          # Break hardlinks so signing one inode does not affect other paths.
          # Use process substitution so exit 1 propagates to the step (not just a subshell).
          echo "=== Breaking hardlinks ==="
          while IFS= read -r -d '' f; do
            echo "Breaking hardlink: $f (nlink=$(stat -f '%l' "$f"))"
            cp "$f" "${f}.__hl_tmp__"
            mv "${f}.__hl_tmp__" "$f"
          done < <(find "$APP" -type f -links +1 -print0)

          # PyInstaller replaces every framework symlink with a real physical file.
          # codesign treats a real Mach-O at Python.framework/Python as a *resource*
          # (not designated code) when signing the bundle, so it records the file's
          # hash without embedding a code signature — and Apple rejects the unsigned
          # Mach-O.  Fix: restore symlinks so codesign sees a normal framework layout.
          echo "=== Restoring Python.framework symlinks ==="
          while IFS= read -r fw; do
            echo "Fixing: $fw"
            CURR="$fw/Versions/Current"
            if [ -d "$CURR" ] && [ ! -L "$CURR" ]; then
              echo "  Versions/Current real dir -> symlink 3.11"
              rm -rf "$CURR"
              ln -s "3.11" "$CURR"
            fi
            TOP="$fw/Python"
            if [ -f "$TOP" ] && [ ! -L "$TOP" ]; then
              echo "  top-level Python real file -> symlink Versions/Current/Python"
              rm "$TOP"
              ln -s "Versions/Current/Python" "$TOP"
            fi
          done < <(find "$APP" -name "Python.framework" -type d)

          # Step 1: Sign all individual Mach-O binaries, skipping framework/Versions/
          # (those are the designated-code files inside framework bundles; the framework
          # bundle signing in step 2 handles them).  After the symlink restoration above,
          # Python.framework/Python is a symlink — find -type f won't see it, which is
          # correct (the framework signing takes care of it through Versions/3.11/Python).
          echo "=== Signing individual Mach-O binaries ==="
          while IFS= read -r -d '' f; do
            if file "$f" | grep -qE "Mach-O"; then
              echo "Signing: $f"
              codesign --force --sign "$IDENTITY" \
                --options runtime \
                --timestamp \
                --entitlements /tmp/entitlements.plist \
                "$f" || { echo "ERROR: codesign failed for $f" >&2; exit 1; }
            fi
          done < <(find "$APP" -type f ! -path "*.framework/Versions/*" -print0)

          # Step 2: Sign framework bundles deepest first (Versions/* before root).
          echo "=== Signing frameworks (deepest first) ==="
          while IFS= read -r fw; do
            echo "Signing framework: $fw"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --timestamp \
              --entitlements /tmp/entitlements.plist \
              "$fw" || { echo "ERROR: codesign failed for $fw" >&2; exit 1; }
          done < <(find "$APP" -name "*.framework" -type d | sort -r)

          # Step 3: Sign the main app bundle last.
          echo "=== Signing app bundle ==="
          codesign --force --verbose \
            --sign "$IDENTITY" \
            --options runtime \
            --timestamp \
            --entitlements /tmp/entitlements.plist \
            "$APP" || { echo "ERROR: codesign failed for app bundle" >&2; exit 1; }

      - name: Verify signatures
        run: |
          APP="dist/Route Planner.app"
          echo "=== Deep bundle verify ==="
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || echo "DEEP VERIFY FAILED"
          echo "=== Per-file check on historically failing binaries ==="
          for f in \
            "$APP/Contents/MacOS/Route Planner" \
            "$APP/Contents/Resources/Python" \
            "$APP/Contents/Frameworks/Python" \
            "$APP/Contents/Resources/Python.framework/Python" \
            "$APP/Contents/Frameworks/Python.framework/Python"; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              codesign -dv "$f" 2>&1
              codesign --verify --strict "$f" 2>&1 && echo "  VERIFY OK" || echo "  VERIFY FAILED"
            else
              echo "--- $f (NOT FOUND) ---"
            fi
          done

      - name: Notarize app
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > /tmp/AuthKey.p8
          cd dist
          # ditto preserves symlinks in the archive; zip -r follows them, which
          # causes Apple to see symlinked Python binaries as standalone unsigned
          # Mach-O files and reject them.
          ditto -c -k --sequesterRsrc --keepParent "Route Planner.app" "Route Planner Mac.zip"
          SUBMIT_OUTPUT=$(xcrun notarytool submit "Route Planner Mac.zip" \
            --key /tmp/AuthKey.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER }}" \
            --wait --output-format json)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          STATUS=$(echo "$SUBMIT_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed with status: $STATUS — fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --key /tmp/AuthKey.p8 \
              --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
              --issuer "${{ secrets.APPLE_API_ISSUER }}"
            rm /tmp/AuthKey.p8
            exit 1
          fi
          xcrun stapler staple "Route Planner.app"
          rm "Route Planner Mac.zip"
          ditto -c -k --sequesterRsrc --keepParent "Route Planner.app" "Route Planner Mac.zip"
          rm /tmp/AuthKey.p8

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: Route-Planner-Mac
          path: dist/Route Planner Mac.zip
          retention-days: 30


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Inject credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
        shell: bash

      - name: Build Windows exe
        run: pyinstaller route_planner.spec

      - name: Zip exe folder
        run: |
          Compress-Archive -Path "dist\Route Planner" -DestinationPath "dist\Route Planner Windows.zip"
        shell: powershell

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Route-Planner-Windows
          path: dist\Route Planner Windows.zip
          retention-days: 30
